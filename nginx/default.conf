# SPA server config — react-router-dom BrowserRouter butuh fallback ke index.html
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # --- compression ---
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # --- security headers ---
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # --- liveness probe (dipakai HEALTHCHECK Dockerfile & compose) ---
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- aset hasil build Vite: nama file ber-hash → cache permanen ---
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files  $uri =404;
    }

    # --- index.html tidak boleh di-cache agar deploy baru langsung terpakai ---
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- fallback SPA + aset statis publik (favicon, gambar) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /index.html;
}
